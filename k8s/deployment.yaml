apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-task

  namespace: devops-task

  labels:
    app.kubernetes.io/name: devops-task
    app.kubernetes.io/component: backend

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  revisionHistoryLimit: 5

  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-task

    spec:
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 10

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: devops-task

          image: devops-task:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: devops-task-config

          # env:
          #   - name: EXAMPLE_TOKEN
          #     valueFrom:
          #       secretKeyRef:
          #         name: devops-task-secret
          #         key: EXAMPLE_TOKEN

          resources:
            requests:
              cpu: 100m
              memory: 32Mi

            limits:
              cpu: 500m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3