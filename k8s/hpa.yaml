apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: devops-task
  namespace: devops-task

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task

  minReplicas: 3
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60