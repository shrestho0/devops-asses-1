apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-task

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

configMapGenerator:
  - name: devops-task-config
    literals:
      - PORT=8080
      - LOG_LEVEL=debug
      - ENV_NAME=local_k8s
      - APP_VERSION=1.0.1

secretGenerator:
  - name: devops-task-secret
    envs:
      - secrets/app.env

images:
  - name: devops-task
    newName: devops-task
    newTag: "1.0.1"

generatorOptions:
  disableNameSuffixHash: false