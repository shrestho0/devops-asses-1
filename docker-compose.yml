services:
  app:
    build:
      context: ./apps/devops-task
      dockerfile: Dockerfile
    container_name: devops-task-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      ENV_NAME: "local"
      APP_VERSION: "1.0.0"
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: true