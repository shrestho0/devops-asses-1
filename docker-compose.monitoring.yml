services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: devops-task-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  loki:
    image: grafana/loki:3.4.2
    container_name: devops-task-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: devops-task-alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    expose:
      - "12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: devops-task-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "9100"
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: devops-task-cadvisor
    restart: unless-stopped
    privileged: true

    devices:
      - /dev/kmsg:/dev/kmsg

    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"

    expose:
      - "8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  alertmanager:
      image: prom/alertmanager:v0.28.1
      container_name: devops-task-alertmanager
      restart: unless-stopped
      environment:
        DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?required}
      entrypoint: ["/bin/sh", "-c"]
      command:
        - "printf '%s' \"$$DISCORD_WEBHOOK_URL\" > /tmp/discord_webhook_url && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager"
      expose:
        - "9093"
      volumes:
        - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
        - alertmanager_data:/alertmanager
      healthcheck:
        test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
        interval: 15s
        timeout: 5s
        retries: 3
        start_period: 10s
      deploy:
        resources:
          limits:
            cpus: "0.20"
            memory: 128M
          reservations:
            cpus: "0.05"
            memory: 32M
            
  grafana:
    image: grafana/grafana:11.5.2
    container_name: devops-task-grafana
    restart: unless-stopped
    ports:
      - "3090:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alertmanager_data:
  